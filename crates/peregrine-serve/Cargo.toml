[package]
name = "peregrine-serve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "peregrine OpenAI-compatible HTTP server (axum/tokio): /v1/chat/completions with SSE streaming"

[[bin]]
name = "peregrine-serve"
path = "src/main.rs"

[features]
# Enables the GPU VRAM expert lane in the loaded model (opt-in at runtime via COLI_GPU).
cuda = ["peregrine-model/cuda"]

[dependencies]
peregrine-model = { path = "../peregrine-model" }
# Alternative MoE engine, installed only when COLI_MOE_ENGINE selects it.
# engine -> sched -> model is acyclic; model -> sched would not be.
peregrine-sched = { path = "../peregrine-sched" }
peregrine-core = { path = "../peregrine-core" }
# For the host energy counter behind the joules-per-token metric; the same
# workspace-path form as every other dependency here.
peregrine-io = { path = "../peregrine-io" }
peregrine-token = { path = "../peregrine-token" }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net"] }
axum = "0.7"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
# Parity oracle only: tests/tokenizer_parity.rs asserts gigatoken ids match
# the HF `tokenizers` crate id-for-id. Not linked into the serve binary.
tokenizers = "0.20"
