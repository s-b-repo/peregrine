[package]
name = "peregrine-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "peregrine offline preprocessing tools: routing-aware expert re-layout and schedule emission"

[lib]
name = "peregrine_tools"
path = "src/lib.rs"

[[bin]]
name = "peregrine-layout-reorg"
path = "src/reorg.rs"

[[bin]]
name = "peregrine-requantize"
path = "src/requant_main.rs"

[[bin]]
name = "peregrine-reshard"
path = "src/reshard_main.rs"

[[bin]]
name = "peregrine-prune"
path = "src/prune_main.rs"

[[bin]]
name = "peregrine-skipbound"
path = "src/skipbound_main.rs"

# Streaming client for peregrine-serve: prints the completion live and times it.
# Deliberately here rather than in peregrine-serve — it must be runnable without
# building the engine, and it takes no dependency the crate does not already have
# (raw HTTP/1.1 over std::net, serde_json for the SSE payloads).
[[bin]]
name = "peregrine-gen"
path = "src/gen_main.rs"

[dependencies]
serde_json.workspace = true
peregrine-core = { path = "../peregrine-core" }

[dev-dependencies]
peregrine-model = { path = "../peregrine-model" }
