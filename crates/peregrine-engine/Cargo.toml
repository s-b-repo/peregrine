[package]
name = "peregrine-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "peregrine engine binary: stdio serve protocol (drop-in for colibrì's c/glm) + demo mode"

[[bin]]
name = "peregrine"
path = "src/main.rs"

[features]
# Enables the GPU VRAM expert lane (opt-in at runtime via COLI_GPU).
cuda = ["peregrine-model/cuda"]

[dependencies]
peregrine-model = { path = "../peregrine-model" }
# Alternative MoE engine, installed only when COLI_MOE_ENGINE selects it.
# engine -> sched -> model is acyclic; model -> sched would not be.
peregrine-sched = { path = "../peregrine-sched" }
peregrine-core = { path = "../peregrine-core" }
# Whole-file loads go through the io_uring helpers, like every other read the
# engine does; the crate is already in the tree via peregrine-model.
peregrine-io = { path = "../peregrine-io" }
peregrine-tools = { path = "../peregrine-tools" }
# `flip-rate` measures a lossy container against its source on real text, and
# random token ids are not real text — see the subcommand's note.
peregrine-token = { path = "../peregrine-token" }
serde_json.workspace = true
